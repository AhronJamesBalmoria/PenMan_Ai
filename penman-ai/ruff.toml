line-length = 100
target-version = "py312"

[lint]
# BLE (blind except) is intentionally not enabled: the auth, page and grammar
# boundaries convert third-party failures into user-facing states, so broad
# `except Exception` is the correct shape there.
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/File()/Form() belong in argument defaults.
ignore = ["B008"]
