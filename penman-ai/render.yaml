service: penman-ai
runtime: PYTHON_3_12
# Free tier gets 768 MB RAM + 1 vCPU - exactly why we swapped sentence-transformers for FastEmbed.
# The app validates these keys at startup; missing ones cause a hard 500 on first request.
env:
  APP_ENV: production
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
  GROQ_API_KEY: ${GROQ_API_KEY}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
  STYLE_DRIFT_THRESHOLD: "0.60"
  LOG_LEVEL: INFO
  # Optional: COOKIE_SECURE=true when serving over HTTPS
  # COOKIE_SECURE: true
ports:
  - port: 8080
    targetPort: 8000
healthCheck:
  httpPath: /health
  interval: 30s
  timeout: 5s