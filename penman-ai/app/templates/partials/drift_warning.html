<div class="drift-alert mb-3" role="alert">
    <span class="drift-alert-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z">
            </path>
            <path d="M12 9v4"></path>
            <path d="M12 17h.01"></path>
        </svg>
    </span>
    <div>
        <div class="drift-alert-title">Style Drift Detected</div>
        <div class="drift-alert-text">{{ drift_warning }}</div>
        <div class="text-center mt-1">
            <button type="button" class="btn drift-accept-btn"
                hx-post="/api/analyze/accept-drift"
                hx-include="#plain-text-input, #essay-type-select"
                hx-target="#baseline-status"
                hx-swap="innerHTML"
                hx-disabled-elt="this"
                title="Add this essay to the writing profile for this essay type">
                This is my usual style — update my style profile
            </button>
        </div>
    </div>
</div>
